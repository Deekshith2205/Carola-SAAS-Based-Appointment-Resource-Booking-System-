services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_booking_db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: saas_booking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d saas_booking']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
